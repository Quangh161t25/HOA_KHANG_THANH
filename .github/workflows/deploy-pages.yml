name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # App chạy ở https://<owner>.github.io/<tên-repo>/
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          # URL ứng dụng web Google Apps Script (Settings → Secrets and variables → Actions → Variables)
          VITE_APPS_SCRIPT_URL: ${{ vars.VITE_APPS_SCRIPT_URL }}
          VITE_GOOGLE_SPREADSHEET_ID: ${{ vars.VITE_GOOGLE_SPREADSHEET_ID }}

      # Mở thẳng link con (vd /hoakhangthanh/ton-ngay) vẫn vào được app
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
